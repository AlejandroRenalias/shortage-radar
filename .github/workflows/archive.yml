name: Archive shortages
on:
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: Accept a reduction of more than 15% after checking the source
        type: boolean
        default: false
concurrency:
  group: fimea-data-writes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      checked: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check and archive source
        id: check
        env:
          ALLOW_LARGE_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_drop }}
          TZ: Europe/Helsinki
        run: |
          if [ "$ALLOW_LARGE_DROP" = true ]; then
            python scripts/archive.py --allow-large-drop
          else
            python scripts/archive.py
          fi
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots data/source/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Fimea shortage data'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: archive
    uses: ./.github/workflows/pages.yml
    with:
      last_checked: ${{ needs.archive.outputs.checked }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      issues: write
  alert:
    if: always() && github.event_name == 'schedule'
    needs: [archive, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-alert
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE: archive
          RESULT: ${{ needs.archive.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
        run: python scripts/pipeline_alert.py
