name: Archive shortages
on:
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:
concurrency:
  group: fimea-data-writes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/archive.py
      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots data/source/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Fimea shortage data'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    if: needs.archive.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    needs: archive
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
