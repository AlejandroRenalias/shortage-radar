name: Archive shortages
on:
  schedule:
    - cron: '35 4 * * *'
    - cron: '5 10 * * *'
    - cron: '35 15 * * *'
    - cron: '5 21 * * *'
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: Accept a reduction of more than 15% after checking the source
        type: boolean
        default: false
concurrency:
  group: fimea-data-writes
  queue: max
jobs:
  freshness:
    uses: ./.github/workflows/freshness.yml
    permissions:
      contents: read
      actions: read
      issues: write
  archive:
    needs: freshness
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: read
    outputs:
      checked: ${{ steps.check.outputs.date }}
      changed: ${{ steps.commit.outputs.changed }}
      pages_current: ${{ steps.pages_status.outputs.current }}
      register: ${{ steps.register.outcome }}
      age: ${{ steps.age.outputs.status }}
      validation: ${{ steps.validate.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check and archive source
        id: check
        env:
          ALLOW_LARGE_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_drop }}
          TZ: Europe/Helsinki
          REJECTED_DOWNLOAD: ${{ runner.temp }}/rejected-shortages.txt
        run: |
          if [ "$ALLOW_LARGE_DROP" = true ]; then
            python scripts/archive.py --allow-large-drop
          else
            python scripts/archive.py
          fi
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Record impact triage counts
        # The register has no history, so the counts are kept with the register of the day. A failure here does not stop the archive,
        # and does not stay quiet: the alert job opens the pipeline issue for it (register-source).
        id: register
        continue-on-error: true
        timeout-minutes: 5
        env:
          TZ: Europe/Helsinki
        run: |
          python scripts/fetch_register.py
          python scripts/record_triage.py
      - name: Record daily ledger
        # Appends the day's rows once; a second run on the same day adds nothing. A failure here does not stop the archive.
        continue-on-error: true
        timeout-minutes: 5
        env:
          TZ: Europe/Helsinki
        run: python scripts/ledger.py
      - name: Record daily counts
        # Writes the day's company and group counts once, as the whole file data/ledger/counts/YYYY-MM-DD.jsonl (temporary file, then rename); an existing day file is not touched. The day is the newest ledger day. A failure here does not stop the archive; check 9 of the validation reports a missing file.
        continue-on-error: true
        timeout-minutes: 5
        env:
          TZ: Europe/Helsinki
        run: python scripts/counts.py
      - name: Validate the daily ledger
        # Twelve checks on the day's ledger rows and counts (scripts/validate_daily.py). It only reads: a failed check changes and deletes no data, writes the message in this log and
        # lets the alert job open the data-validation entry of the pipeline issue. It runs before the commit and before anything is published.
        id: validate
        continue-on-error: true
        timeout-minutes: 5
        env:
          TZ: Europe/Helsinki
        run: python scripts/validate_daily.py
      - name: Check age of the source files
        # Fails when the shortage file's Last-Modified or the register's run date is more than 2 days old. It does not stop the archive; the alert job opens the pipeline issue (source-stale).
        id: age
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/source_age.py
      - name: Preserve rejected download
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rejected-shortages
          path: ${{ runner.temp }}/rejected-shortages.txt
          retention-days: 30
          if-no-files-found: ignore
      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots data/source/metadata.json data/triage-counts.json
          # The ledger is optional output: it does not exist when its step failed before writing the first file.
          # counts guard start
          # A committed counts day is never changed or deleted: whatever happened to it in this run is undone. A new day file that is not a complete
          # UTF-8 day is removed, never staged. Temporary files are never staged.
          rm -f data/ledger/counts/.tmp-*
          git ls-files data/ledger/counts | while read -r f; do git checkout -- "$f"; done
          for f in data/ledger/counts/*.jsonl; do
            [ -e "$f" ] || continue
            if ! python scripts/counts.py --check "$f"; then
              echo "::error::$f is not a complete counts day and is not committed"
              git ls-files --error-unmatch "$f" >/dev/null 2>&1 || rm -f "$f"
            fi
          done
          # counts guard end
          if [ -d data/ledger ]; then git add data/ledger; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Fimea shortage data'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check latest Pages deployment
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Helsinki
        run: |
          current=false
          if deployment=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&ref=main&per_page=1" --jq '.[0].id // empty') && [ -n "$deployment" ]; then
            if status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=1" --jq '.[0] | select(.state == "success") | .created_at') && [ -n "$status" ] && [ "$(date -d "$status" +%F)" = "$(date +%F)" ]; then
              current=true
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
  deploy:
    # An unavailable or empty freshness lookup forces this run's deploy; it does not retry itself.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.archive.result == 'success' && (needs.archive.outputs.changed == 'true' || needs.archive.outputs.checked != needs.freshness.outputs.last_checked || needs.archive.outputs.pages_current != 'true')
    needs: [freshness, archive]
    uses: ./.github/workflows/pages.yml
    with:
      last_checked: ${{ needs.archive.outputs.checked }}
      called_by_archive: true
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      issues: write
  alert:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [archive, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-alert
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE: archive
          RESULT: ${{ needs.archive.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && 'success' || 'failure' }}
        run: |
          python scripts/pipeline_alert.py
          if [ '${{ needs.archive.result }}' = success ]; then
            PIPELINE=archive-stale RESULT=success python scripts/pipeline_alert.py
            # The register step and the age check continue on error; their outcome opens or closes the issue entry here.
            PIPELINE=register-source RESULT=${{ needs.archive.outputs.register == 'failure' && 'failure' || 'success' }} python scripts/pipeline_alert.py
            # Stale opens the alert, fresh closes it; unknown (a missing or unreadable date, or a step that did not finish) leaves it as it is.
            if [ '${{ needs.archive.outputs.age }}' = stale ]; then PIPELINE=source-stale RESULT=failure python scripts/pipeline_alert.py; fi
            if [ '${{ needs.archive.outputs.age }}' = fresh ]; then PIPELINE=source-stale RESULT=success python scripts/pipeline_alert.py; fi
            # A failed daily check (or a check that could not run) opens the data-validation entry; passing checks close it; a step that did not finish leaves it as it is.
            if [ '${{ needs.archive.outputs.validation }}' = fail ] || [ '${{ needs.archive.outputs.validation }}' = error ]; then PIPELINE=data-validation RESULT=failure python scripts/pipeline_alert.py; fi
            if [ '${{ needs.archive.outputs.validation }}' = pass ]; then PIPELINE=data-validation RESULT=success python scripts/pipeline_alert.py; fi
          fi
