name: Review screenshots
on:
  pull_request:
    paths: ['.github/workflows/review-screenshots.yml']
permissions:
  contents: read
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python scripts/fetch_register.py
      - run: python scripts/build.py
      - run: npm install --no-save puppeteer-core
      - name: Take screenshots
        run: |
          cat > shoot.mjs <<'JS'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import puppeteer from 'puppeteer-core';
          const types = {'.html':'text/html; charset=utf-8','.js':'text/javascript','.css':'text/css','.json':'application/json','.woff2':'font/woff2','.png':'image/png','.svg':'image/svg+xml','.xml':'application/xml','.csv':'text/csv'};
          const server = http.createServer((req, res) => {
            const url = new URL(req.url, 'http://x');
            const file = path.join('site', decodeURIComponent(url.pathname.replace(/^\/shortage-radar/, '')));
            fs.readFile(file, (err, buf) => {
              if (err) { fs.readFile('site/404.html', (e, b) => { res.writeHead(404, {'content-type': 'text/html; charset=utf-8'}); res.end(b); }); return; }
              res.writeHead(200, {'content-type': types[path.extname(file)] || 'application/octet-stream'}); res.end(buf);
            });
          });
          await new Promise(r => server.listen(0, '127.0.0.1', r));
          const base = `http://127.0.0.1:${server.address().port}/`;
          const pages = {index:'index.html', shortages:'shortages.html', 'shortages-empty':'shortages.html?q=zzzz', 'medicine-soon':'medicine.html?vnr=599361', 'medicine-left':'medicine.html?vnr=590458', 'medicine-vet':'medicine.html?vnr=100799', 'medicine-unknown':'medicine.html?vnr=000000', trends:'trends.html', about:'about.html', 404:'missing.html'};
          const sizes = {phone:[412, 915], desktop:[1440, 900]};
          fs.mkdirSync('screenshots', {recursive: true});
          const browser = await puppeteer.launch({executablePath: '/usr/bin/google-chrome', headless: 'new', args: ['--no-sandbox']});
          for (const lang of ['en', 'fi']) for (const [size, [w, h]] of Object.entries(sizes)) for (const [name, pg] of Object.entries(pages)) {
            const page = await browser.newPage();
            await page.setViewport({width: w, height: h, isMobile: w < 600, hasTouch: w < 600});
            await page.evaluateOnNewDocument(l => localStorage.setItem('language', l), lang);
            await page.goto(base + pg, {waitUntil: 'networkidle0'});
            await new Promise(r => setTimeout(r, 400));
            await page.screenshot({path: `screenshots/${name}-${lang}-${size}.png`, fullPage: true});
            await page.close();
          }
          await browser.close(); server.close();
          JS
          node shoot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: review-screenshots
          path: screenshots
          retention-days: 30
