name: Review screenshots
on:
  push:
    branches: [AlejandroRenalias/other-packages]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python scripts/fetch_register.py && python scripts/build.py
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - name: Capture English and Finnish cards
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory site &
          node -e 'const {chromium}=require("playwright"); (async()=>{const b=await chromium.launch({headless:true});for(const lang of ["en","fi"]){const p=await b.newPage({viewport:{width:1440,height:900}});await p.goto("http://127.0.0.1:8000/");await p.waitForSelector("#list article");await p.selectOption("#language",lang);await p.locator("#shortages").evaluate(e=>e.scrollIntoView());await p.screenshot({path:`cards-${lang}.png`});await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)})'
      - uses: actions/upload-artifact@v7
        with:
          name: other-package-cards
          path: cards-*.png
          retention-days: 30
