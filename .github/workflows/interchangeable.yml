name: Update interchangeable products
on:
  schedule:
    - cron: '20 3 1 * *'
  workflow_dispatch:
concurrency:
  group: fimea-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python scripts/update_interchangeable.py
      - run: python -m pytest -q
      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/source
          if ! git diff --cached --quiet; then
            git commit -m 'Update Fimea interchangeable products'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No changes to interchangeable products'
          fi
  deploy:
    if: needs.update.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
