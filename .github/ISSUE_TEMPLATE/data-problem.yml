name: Report an error on the site
description: Something on Shortage Radar looks wrong or does not match its source.
title: "Error: "
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Do not write personal or health details.
  - type: input
    id: page
    attributes:
      label: Page link
      description: The address of the page with the error. Copy it from the address bar.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Say what the site shows and what you expected.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to Fimea, EMA or another source that shows the right information.
    validations:
      required: false
